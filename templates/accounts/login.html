{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5">
<div class="card p-4"><h3 class="mb-3">Login</h3>
<form method="post">{% csrf_token %}
{{ form.non_field_errors }}
<div class="mb-3"><label>Username</label>{{ form.username }}</div>
<div class="mb-3"><label>Password</label>{{ form.password }}</div>
<button class="btn btn-primary w-100">Login</button>
</form></div></div></div>
{% endblock %}
