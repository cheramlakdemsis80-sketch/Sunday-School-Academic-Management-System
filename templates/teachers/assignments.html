{% extends "base.html" %}
{% block content %}
<h2>My Teaching Assignments</h2>
<div class="table-responsive"><table class="table table-bordered"><thead><tr><th>Academic Year</th><th>Class</th><th>Subject</th></tr></thead><tbody>
{% for a in assignments %}<tr><td>{{ a.academic_year }}</td><td>{{ a.school_class }}</td><td>{{ a.subject }}</td></tr>{% empty %}<tr><td colspan="3">No assignments yet.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
