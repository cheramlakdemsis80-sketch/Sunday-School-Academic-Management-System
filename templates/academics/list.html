{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h2>{{ title }}</h2><a class="btn btn-primary" href="{% url create_url %}">Add New</a></div>
{% if q is not None %}<form class="mb-3"><div class="input-group"><input class="form-control" name="q" value="{{ q }}" placeholder="Search..."><button class="btn btn-outline-secondary">Search</button></div></form>{% endif %}
<div class="table-responsive"><table class="table table-bordered align-middle"><thead><tr><th>Information</th><th>Actions</th></tr></thead><tbody>
{% for obj in objects %}
<tr><td>{{ obj }}</td><td>
{% if obj.pk %}
<a class="btn btn-sm btn-outline-primary" href="{% if title == 'Academic Years' %}{% url 'year_edit' obj.pk %}{% elif title == 'Semesters' %}{% url 'semester_edit' obj.pk %}{% elif title == 'Classes / Sections' %}{% url 'class_edit' obj.pk %}{% else %}{% url 'subject_edit' obj.pk %}{% endif %}">Edit</a>
<a class="btn btn-sm btn-outline-danger" href="{% if title == 'Academic Years' %}{% url 'year_delete' obj.pk %}{% elif title == 'Semesters' %}{% url 'semester_delete' obj.pk %}{% elif title == 'Classes / Sections' %}{% url 'class_delete' obj.pk %}{% else %}{% url 'subject_delete' obj.pk %}{% endif %}" onclick="return confirm('Delete this item?')">Delete</a>
{% endif %}</td></tr>
{% empty %}<tr><td colspan="2">No records found.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
