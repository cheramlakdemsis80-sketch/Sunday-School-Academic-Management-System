{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h2>Teacher Assignments</h2><a class="btn btn-primary" href="{% url 'assignment_add' %}">Add Assignment</a></div>
<div class="table-responsive"><table class="table table-bordered"><thead><tr><th>Teacher</th><th>Subject</th><th>Class</th><th>Academic Year</th><th>Actions</th></tr></thead>
<tbody>{% for a in objects %}<tr><td>{{ a.teacher }}</td><td>{{ a.subject }}</td><td>{{ a.school_class }}</td><td>{{ a.academic_year }}</td><td>
<a class="btn btn-sm btn-outline-primary" href="{% url 'assignment_edit' a.pk %}">Edit</a>
<a class="btn btn-sm btn-outline-danger" href="{% url 'assignment_delete' a.pk %}" onclick="return confirm('Delete assignment?')">Delete</a>
</td></tr>{% empty %}<tr><td colspan="5">No assignments found.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
