<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunday School Academic System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f5f7fb}.navbar-brand{font-weight:700}.card{border:0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.sidebar a{display:block;padding:9px 12px;text-decoration:none;border-radius:8px;color:#333}.sidebar a:hover{background:#e9eef7}
.table{background:#fff}.stat{font-size:1.8rem;font-weight:700}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid"><a class="navbar-brand" href="{% url 'dashboard' %}">Sunday School Academic System</a>
<div class="d-flex align-items-center gap-3 text-white">
{% if request.user.is_authenticated %}<span>{{ request.user.get_full_name|default:request.user.username }}</span>
<a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Logout</a>{% endif %}
</div></div>
</nav>
<div class="container-fluid py-4">
{% if messages %}{% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}{% endif %}
{% block content %}{% endblock %}
</div>
</body>
</html>
